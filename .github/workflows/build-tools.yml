name: Build Tools

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: build-tools
    cancel-in-progress: true

jobs:
    ensure-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
        - name: Ensure release exists
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh release create tools --repo "$GITHUB_REPOSITORY" --title "Tools" --latest=false || true

    build:
        needs: ensure-release
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      archive: tools-linux-x64.tar.gz
                    - os: windows-latest
                      archive: tools-win-x64.tar.gz

        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            fetch-depth: 1

        # The Go module lives in a submodule, so there is no go.mod at the root for setup-go to cache
        - name: Setup Go
          id: setup-go
          background: true
          uses: actions/setup-go@v7
          with:
            go-version: 'stable'
            cache: false

        - name: Setup .NET
          id: setup-dotnet
          background: true
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.x'

        - name: Update submodules
          shell: bash
          run: ./tools/build.sh submodules

        # DumpSource2 only needs CMake and the compiler from the runner image
        - name: Build DumpSource2
          id: dumpsource2
          background: true
          shell: bash
          run: ./tools/build.sh dumpsource2

        - name: Wait for Go and .NET
          wait: [setup-go, setup-dotnet]

        - name: Build tools
          shell: bash
          run: ./tools/build.sh --skip submodules --skip dumpsource2

        - name: Wait for DumpSource2
          wait: dumpsource2

        - name: Create archive
          shell: bash
          run: ./tools/archive.sh "${{ matrix.archive }}"

        - name: Upload to release
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh release upload tools --clobber tools/${{ matrix.archive }}

    update-release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
        - name: Update release notes
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh release edit tools --repo "$GITHUB_REPOSITORY" --notes "Automated tools build from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)"
